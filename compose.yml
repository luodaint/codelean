name: codelean
x-database: &database
  DATABASE_URL: postgresql://${POSTGRES_USER:-codelean}:${POSTGRES_PASSWORD:?Generate .env with npm run setup}@postgres:5432/${POSTGRES_DB:-codelean}
x-auth: &auth
  APP_URL: ${APP_URL:?Set APP_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate .env with npm run setup}
  SIGNUP_MODE: ${SIGNUP_MODE:-open}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  DEV_AUTH_BYPASS: "false"
x-github: &github
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_PRIVATE_KEY_BASE64: ${GITHUB_PRIVATE_KEY_BASE64:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Generate webhook secret}
x-billing: &billing
  BILLING_ENABLED: ${BILLING_ENABLED:-auto}
  OPERATOR_GITHUB_ID: ${OPERATOR_GITHUB_ID:-}
  CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
  CREEM_TEST_MODE: ${CREEM_TEST_MODE:-true}
  CREEM_API_KEY: ${CREEM_API_KEY:-}
  CREEM_PLAN_PRODUCT_ID: ${CREEM_PLAN_PRODUCT_ID:-}
  CREEM_TOKEN_PRODUCT_ID: ${CREEM_TOKEN_PRODUCT_ID:-}
  CREEM_METER_ID: ${CREEM_METER_ID:-}
  BILLING_PROVIDER_TOKEN_BUDGET: ${BILLING_PROVIDER_TOKEN_BUDGET:-3000000000}
  BILLING_PROVIDER_PERIOD_START: ${BILLING_PROVIDER_PERIOD_START:-}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codelean}
      POSTGRES_DB: ${POSTGRES_DB:-codelean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: codelean-worker:0.1.0
    build: { context: ., target: worker }
    command: [node, --import, tsx, scripts/migrate.ts]
    environment:
      <<: [*database, *auth]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
  web:
    image: codelean-web:0.1.0
    build: { context: ., target: web }
    environment:
      <<: [*database, *auth, *github, *billing]
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NAN_MODEL: ${NAN_MODEL:-}
    networks: [backend, default]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: codelean-worker:0.1.0
    build: { context: ., target: worker }
    environment:
      <<: [*database, *github, *billing]
      APP_URL: ${APP_URL}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TOKEN_PARAMETER: ${LLM_TOKEN_PARAMETER:-max_tokens}
      NAN_BASE_URL: ${NAN_BASE_URL:-https://api.nan.builders/v1}
      NAN_API_KEY: ${NAN_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NAN_MODEL: ${NAN_MODEL:-}
      NAN_FALLBACK_MODEL: ${NAN_FALLBACK_MODEL:-}
      SCANNER_URL: http://scanner:8080
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Generate scanner token}
    networks: [backend, scans, default]
    depends_on:
      migrate: { condition: service_completed_successfully }
      scanner: { condition: service_healthy }
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
  scanner:
    image: codelean-scanner:0.1.0
    build: { context: ./scanner }
    environment:
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Generate scanner token}
    networks: [scans]
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  backend: { internal: true }
  scans: { internal: true }
  default: {}
volumes:
  postgres_data:
