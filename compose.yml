name: luoda-pr-checker
x-database: &database
  DATABASE_URL: postgresql://luoda:${POSTGRES_PASSWORD:?Generate .env with npm run setup}@postgres:5432/luoda
x-auth: &auth
  APP_URL: ${APP_URL:?Set APP_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate .env with npm run setup}
  ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS}
  DEV_AUTH_BYPASS: "false"
x-github: &github
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_PRIVATE_KEY_BASE64: ${GITHUB_PRIVATE_KEY_BASE64:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Generate webhook secret}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: luoda
      POSTGRES_DB: luoda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U luoda -d luoda"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: luoda-pr-checker-worker:0.1.0
    build: { context: ., target: worker }
    command: [node, --import, tsx, scripts/migrate.ts]
    environment:
      <<: [*database, *auth]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
  web:
    image: luoda-pr-checker-web:0.1.0
    build: { context: ., target: web }
    environment:
      <<: [*database, *auth, *github]
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NAN_MODEL: ${NAN_MODEL:-}
    networks: [backend, default]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: luoda-pr-checker-worker:0.1.0
    build: { context: ., target: worker }
    environment:
      <<: [*database, *github]
      APP_URL: ${APP_URL}
      NAN_BASE_URL: ${NAN_BASE_URL:-https://api.nan.builders/v1}
      NAN_API_KEY: ${NAN_API_KEY:-}
      NAN_MODEL: ${NAN_MODEL:-}
      SCANNER_URL: http://scanner:8080
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Generate scanner token}
    networks: [backend, scans, default]
    depends_on:
      migrate: { condition: service_completed_successfully }
      scanner: { condition: service_healthy }
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
  scanner:
    image: luoda-pr-checker-scanner:0.1.0
    build: { context: ./scanner }
    environment:
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Generate scanner token}
    networks: [scans]
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  backend: { internal: true }
  scans: { internal: true }
  default: {}
volumes:
  postgres_data:
