name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codelean
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: codelean
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codelean -d codelean"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://codelean:ci-test-password@localhost:5432/codelean
      TEST_DATABASE_URL: postgresql://codelean:ci-test-password@localhost:5432/codelean
      APP_URL: http://localhost:3100
      ADMIN_EMAILS: admin@example.test
      BETTER_AUTH_SECRET: ci-only-secret-not-a-deployment-credential-123456789
      DEV_AUTH_BYPASS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: python3 -m unittest discover -s scanner -p 'test_*.py'
      - run: npm run build
      - run: npm run typecheck
