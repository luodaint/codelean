# Use together with compose.yml. Set APP_DOMAIN and a matching HTTPS APP_URL.
# Choose a unique Compose project name and router prefix for multiple installations.
services:
  web:
    networks: [dokploy-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.luoda-pr-checker.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)
      traefik.http.routers.luoda-pr-checker.entrypoints: websecure
      traefik.http.routers.luoda-pr-checker.tls.certresolver: letsencrypt
      traefik.http.services.luoda-pr-checker.loadbalancer.server.port: "3000"
networks:
  dokploy-network:
    external: true
